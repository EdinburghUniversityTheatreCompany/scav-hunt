# Mirrors the local hk hooks (hk.pkl) so CI and pre-commit can't drift.
#
# Actions are pinned to a commit SHA with the release tag in a trailing comment (supply-chain
# safety — tags are mutable and an account takeover can repoint them). Bump with `pinact run -u`
# and verify with the dev-env-setup skill's scripts/check_action_refs.sh.
#
# Toolchain provisioning: ruby comes from ruby/setup-ruby (it owns the bundler cache);
# node/yarn come from jdx/mise-action, which reads this repo's mise.toml + mise.lock — the
# single source of truth for ruby/node/yarn (see CLAUDE.md). Every job that shells out to
# node, npx or yarn provisions them explicitly with `install_args:` instead of trusting whatever
# Node the ubuntu-latest image happens to ship that week: yarn.lock now requires Node >= 20
# (brace-expansion@5 declares engines "20 || >=22", playwright@1.62.1 ">=20"), so an older
# runner Node fails `yarn install` outright. mise-action is placed *before* ruby/setup-ruby
# so setup-ruby's PATH entry still wins for `ruby`/`bundle`.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Default GITHUB_TOKEN to read-only; a job needing more declares its own permissions: block.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision Node from mise.toml
        # `herb lint` below shells out to npx; node only — this job never touches yarn.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: node
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Make bin files executable
        run: chmod +x bin/*
      - name: Lint code for consistent style
        # rubocop loads the rubocop-minitest and rubocop-mick plugins via .rubocop.yml.
        run: bin/rubocop -f github
      - name: Analyze ERB templates for parse errors (herb)
        run: bundle exec herb analyze app/
      - name: Lint ERB templates (herb)
        # `herb lint` delegates to npx @herb-tools/linter (version pinned to the herb gem), run on
        # the mise-provisioned Node above rather than the runner image's bundled one.
        # --github emits Actions annotations; --fail-level error (default) gates.
        run: bundle exec herb lint app/ --github
      - name: Executable bits on shipped scripts
        # Any tracked file whose first line is a shebang must be mode 100755 in the
        # index — with core.fileMode=false a local chmod never reaches git, and a
        # 100644 script dies with exit 126 on every fresh clone. Checks the INDEX, so
        # the `chmod +x bin/*` step above doesn't mask it. Mirrors the hk
        # `exec-bit-scripts` step so CI and pre-commit agree.
        run: |
          bad=$(git ls-files -s | awk -F'\t' '$1 ~ /^100644/ { if ((getline line < $2) > 0 && line ~ /^#!/) print $2; close($2) }')
          if [ -n "$bad" ]; then
            echo "Shebang scripts missing the executable bit in the git index. Fix: git update-index --chmod=+x <file>"
            echo "$bad"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        # Digest-pinned (tags are mutable). Was a bare `mysql`, i.e. whatever :latest happened
        # to be that day. Refresh with:
        #   docker buildx imagetools inspect mysql:8.4 --format '{{.Manifest.Digest}}'
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        # No google-chrome-stable: system tests drive Chromium through Playwright now, and
        # `playwright install` below provisions its own pinned browser build.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            curl default-mysql-client libjemalloc2 libvips
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision Node + Yarn from mise.toml
        # node 22.23.4 + yarn 1.22.19, resolved from mise.toml and checksum-verified against
        # mise.lock (mise-action appends --locked when a lock file is present). This job is
        # where the pin is load-bearing: `bin/rails db:test:prepare` shells out to `yarn`
        # via jsbundling/cssbundling, and yarn.lock's engines floor is Node 20.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: node yarn
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Make bin files executable
        run: chmod +x bin/*
      - name: Install Playwright's Chromium
        # `bin/rails test:system` runs `yarn install` itself (jsbundling/cssbundling enhance
        # test:prepare), but nothing there fetches the browser, so do both explicitly first.
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stops the npm postinstall pulling all three
        # engines; only Chromium is needed, and --with-deps adds its shared libraries.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          yarn install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run tests
        env:
          RAILS_ENV: test
          # The user matters: without one, Rails falls back to database.yml's
          # `username: scav_hunt`, which does not exist in the service container --
          # the service is started with MYSQL_ALLOW_EMPTY_PASSWORD, i.e. root only.
          DATABASE_URL: mysql2://root@127.0.0.1:3306
        run: bin/rails db:test:prepare test test:system
      - name: Model/DB consistency (database_consistency)
        # The test DB is prepared above, so this gates (not advisory). Checks model
        # validations/associations against the actual schema (missing NOT NULL, indexes, etc.).
        env:
          RAILS_ENV: test
          # The user matters: without one, Rails falls back to database.yml's
          # `username: scav_hunt`, which does not exist in the service container --
          # the service is started with MYSQL_ALLOW_EMPTY_PASSWORD, i.e. root only.
          DATABASE_URL: mysql2://root@127.0.0.1:3306
        run: bundle exec database_consistency
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Security scanning — mirrors Rails 8's default scan_ruby/scan_js jobs, plus a gem CVE check.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Make bin files executable
        run: chmod +x bin/*
      - name: Rails security scan (brakeman)
        # Loaded via Gem.bin_path, not `bundle exec brakeman`, so PATH can't resolve the
        # repo's bin/brakeman binstub instead — that binstub injects --ensure-latest and
        # would fail on the gem being behind rather than on the scan. Mirrors the hk step.
        run: bundle exec ruby -e 'load Gem.bin_path("brakeman", "brakeman")' -- -q --no-pager --exit-on-warn
      - name: Dependency CVE scan (bundler-audit)
        # Best-effort DB refresh (network); `check` always gates against the bundled-or-updated DB.
        run: |
          bundle exec bundle-audit update >/dev/null 2>&1 || true
          bundle exec bundle-audit check
      - name: JS dependency scan (importmap audit)
        # Only meaningful for importmap-rails apps; this app bundles with esbuild, so it skips.
        run: '[ -f bin/importmap ] && bin/importmap audit || echo "no bin/importmap — skipping"'

  # Run the MIT-licensed gitleaks CLI (via mise, version-pinned in mise.lock) rather than
  # gitleaks/gitleaks-action: the action requires a paid GITLEAKS_LICENSE on org-owned repos,
  # while the CLI is free for all repos and is exactly what the local hk pre-commit hook runs.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks git scans the full commit history
          persist-credentials: false
      - name: Provision gitleaks from mise.toml
        # Scoped: without install_args mise installs every tool in mise.toml —
        # including ruby, node and yarn — for a job that only runs gitleaks.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: gitleaks
      - name: Scan git history for secrets
        run: mise exec -- gitleaks git --redact --no-banner .

  # GitHub Actions workflow checks — mirrors the hk `actionlint` + `zizmor` steps. actionlint
  # covers schema/expression/`needs:` correctness (its shellcheck-of-run: pass is off, see the hk
  # step); zizmor covers security — credential persistence, template injection, over-broad
  # GITHUB_TOKEN. zizmor uses offline audits only, so no token is needed.
  # Mirrors the hk `versions` step: the toolchain and MySQL versions are pinned in
  # several files and nothing keeps them in step on its own. Needs no toolchain of its
  # own -- it only reads files -- so it is the cheapest job here.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and service versions agree across files
        run: bash scripts/check_version_sync.sh

  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision actionlint + zizmor from mise.toml
        # Scoped for the same reason as the gitleaks job above.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: actionlint zizmor
      - name: Lint workflows (actionlint)
        run: actionlint -shellcheck=
      - name: Scan workflows with zizmor
        run: zizmor --no-progress .github/workflows/

  # Noisier audits — mirror the hk `check` hook.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision Node from mise.toml
        # scripts/run-jscpd.sh resolves and runs jscpd through npx; node only, no yarn.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: node
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Dead code (debride)
        run: bundle exec debride --exclude vendor,node_modules,tmp,log .
      - name: Duplication (flay — Ruby structural, advisory)
        # flay has no dir --exclude, so scope to source dirs — otherwise it (like debride) scans
        # the bundler-cache vendor/bundle gems. Mirrors hk.
        run: bundle exec flay app lib || true # flay exits 0 anyway; surfaces structural clones
      - name: Performance anti-patterns (fasterer — advisory)
        run: bundle exec fasterer || true
      - name: Duplication (jscpd — polyglot gate)
        # -f scopes to code formats (no config equivalent); .jscpd.json carries
        # minTokens/threshold/reporters/gitignore/ignore globs. Runner + version policy are
        # shared with the hk pre-commit gate via scripts/run-jscpd.sh; --require keeps CI
        # strict (an unrunnable jscpd fails the job).
        run: bash scripts/run-jscpd.sh --require ruby,erb,javascript,typescript,css,scss,sass,vue
      - name: Large files
        run: |
          limit=512000
          large=$(git ls-files | while read -r f; do
            s=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$s" -gt "$limit" ]; then echo "$f ($s bytes)"; fi
          done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
