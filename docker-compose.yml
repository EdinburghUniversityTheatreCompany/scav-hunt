services:
  rails:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      # Host port is configurable so several instances can share one Docker host.
      # Set APP_PORT in .env (per instance); defaults to the original 2024.
      - "${APP_PORT:-2024}:3000"
    environment:
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY}"
      SCAV_HUNT_DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      SCAV_HUNT_DATABASE_USER: root
      SCAV_HUNT_DATABASE_NAME: "${DATABASE_NAME}"
      SCAV_HUNT_DATABASE_HOST: database
      REDIS_URL: "redis://redis:6379/1"
      # HOST_URL is a bare host[:port] (see README), and both of these need a scheme
      # around it. Passing it through raw broke both: the browser resolved a
      # scheme-less action-cable-url *relative to the current page*, so every scorer's
      # WebSocket went to /scoring/<hostname> and 404'd, and an Origin header is
      # "https://<host>", which a bare host never string-matches. Serving is over TLS
      # via the Nginx block in the README, matching config.force_ssl = true.
      ACTION_CABLE_FRONTEND_URL: "wss://${HOST_URL}/cable"
      ACTION_CABLE_ALLOWED_REQUEST_ORIGINS: "https://${HOST_URL}"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    pull_policy: build

  database:
    # 8.4 is the LTS line, and it is what CI tests against — see scripts/check_version_sync.sh,
    # which fails if these drift apart. 8.3 was an Innovation release, superseded by 8.4.
    image: "mysql:8.4"
    environment:
      MYSQL_ROOT_PASSWORD: "${DATABASE_PASSWORD}"
      MYSQL_DATABASE: "${DATABASE_NAME}"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: "redis:7.4"
    # Deliberately NOT published to the host. Only the rails service talks to it, over
    # the compose network at redis://redis:6379/1 (see REDIS_URL above). Publishing it
    # bound an unauthenticated Redis to 0.0.0.0:6379 on the host, and made a second
    # instance on the same host impossible.
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: